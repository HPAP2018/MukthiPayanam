// ── Map ────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [15, 79], zoom: 6, zoomControl: true });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

// ── Reset button ──────────────────────────────────────────────────────────────
const resetBtn = L.control({ position: 'topleft' });
resetBtn.onAdd = () => {
  const btn = L.DomUtil.create('button');
  btn.title = 'Reset view';
  btn.innerHTML = '&#8962;';
  btn.style.cssText = 'width:34px;height:34px;background:#fff;border:2px solid rgba(0,0,0,0.2);border-radius:4px;color:#333;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:6px;';
  L.DomEvent.disableClickPropagation(btn);
  btn.addEventListener('click', () => map.setView([15, 79], 6, { animate: true }));
  return btn;
};
resetBtn.addTo(map);

// ── Legend ────────────────────────────────────────────────────────────────────
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<div class="legend-title">Regions</div>';
  Object.entries(STATE_COLORS).forEach(([state, color]) => {
    const count = TEMPLES.filter(t => t.state === state).length;
    div.innerHTML += `<div class="legend-row"><span class="legend-dot" style="background:${color}"></span><span>${state} (${count})</span></div>`;
  });
  return div;
};
legend.addTo(map);

// ── Markers ───────────────────────────────────────────────────────────────────
function popupHTML(t) {
  const loc = [t.place, t.district, t.state].filter(Boolean).join(', ');
  return `<div class="popup-no">DIVYA DESAM #${t.no}</div>
    <div class="popup-name">${t.name}</div><hr class="popup-divider">
    <div class="popup-row"><b>Place:</b> ${loc}</div>
    ${t.perumal ? `<div class="popup-row"><b>Perumal:</b> ${t.perumal}</div>` : ''}
    ${t.thayar  ? `<div class="popup-row"><b>Thayar:</b> ${t.thayar}</div>`  : ''}`;
}

const markers = {};
TEMPLES.forEach(t => {
  const color = STATE_COLORS[t.state] || '#aaa';
  const m = L.circleMarker([t.lat, t.lng], {
    radius: 7, fillColor: color, color: '#1a1208', weight: 1.5, fillOpacity: 0.9,
  }).addTo(map);
  m.bindPopup(popupHTML(t), { maxWidth: 280 });
  m.on('click', () => highlightItem(t.no));
  markers[t.no] = m;
});

// ── Sidebar & Filtering ──────────────────────────────────────────────────────
const states = [...new Set(TEMPLES.map(t => t.state))];
let activeFilters = new Set(states);
const filterDiv = document.getElementById('state-filter');

const allBtn = document.createElement('button');
allBtn.textContent = 'All';
allBtn.className = 'filter-btn active';
allBtn.style.cssText = 'background:#5a3d10;color:#ffd966;border-color:#c8860a;';
filterDiv.appendChild(allBtn);

const stateBtns = {};
states.forEach(state => {
  const btn = document.createElement('button');
  btn.textContent = state;
  btn.className = 'filter-btn active';
  const color = STATE_COLORS[state] || '#aaa';
  btn.style.cssText = `background:${color}22;color:${color};border-color:${color};`;
  filterDiv.appendChild(btn);
  stateBtns[state] = btn;
  btn.addEventListener('click', () => {
    activeFilters.has(state) ? activeFilters.delete(state) : activeFilters.add(state);
    btn.classList.toggle('active');
    applyFilters();
  });
});

allBtn.addEventListener('click', () => {
  if (activeFilters.size === states.length) {
    activeFilters.clear();
    Object.values(stateBtns).forEach(b => b.classList.remove('active'));
    allBtn.textContent = 'None';
  } else {
    activeFilters = new Set(states);
    Object.values(stateBtns).forEach(b => b.classList.add('active'));
    allBtn.textContent = 'All';
  }
  applyFilters();
});

const list = document.getElementById('temple-list');
TEMPLES.forEach(t => {
  const color = STATE_COLORS[t.state] || '#aaa';
  const item = document.createElement('div');
  item.className = 'temple-item'; item.id = `item-${t.no}`;
  item.innerHTML = `<div class="t-num">${t.no}</div>
    <div class="t-dot" style="background:${color}"></div>
    <div class="t-info"><div class="t-name">${t.name}</div>
    <div class="t-place">${[t.place, t.district].filter(Boolean).join(', ')}</div></div>`;
  item.addEventListener('click', () => {
    map.setView([t.lat, t.lng], 12, { animate: true });
    markers[t.no].openPopup();
    highlightItem(t.no);
  });
  list.appendChild(item);
});

function highlightItem(no) {
  document.querySelectorAll('.temple-item').forEach(el => el.classList.remove('highlighted'));
  const el = document.getElementById(`item-${no}`);
  if (el) { el.classList.add('highlighted'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  TEMPLES.forEach(t => {
    const show = activeFilters.has(t.state) &&
      (!q || t.name.toLowerCase().includes(q) || t.place.toLowerCase().includes(q) || t.state.toLowerCase().includes(q));
    show ? markers[t.no].addTo(map) : markers[t.no].remove();
    const el = document.getElementById(`item-${t.no}`);
    if (el) el.style.display = show ? '' : 'none';
  });
}
document.getElementById('search').addEventListener('input', applyFilters);
</script>
